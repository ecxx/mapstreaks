	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"

	<nav class="navbar navbar-expand-lg navbar-dark">
		<div class="container-fluid">
			<a href="/" class="navbar-brand text-light mx-2">CCL TAG</a>
			<button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarCollapse">
				<div class="navbar-nav ms-auto">
					
				</div>
			</div>
		</div>
	</nav>

	<div class="container mt-5">

		<p id="p_loading">Loading Data...</p>

		<div id="f_g5">
			<button class="btn btn-primary mb-3" type="submit" id="b_start">generate 5</button>
		</div>

		<div id="f_g1">
			<div class="input-group mb-3 w-50">
				<input type="text" class="form-control" id="f_g1_ii" name="key" placeholder="Your Current Stop Key">
				<input type="text" class="form-control" id="f_g1_i" name="key" placeholder="Your Current Busstop ID" aria-label="bus_guess" aria-describedby="bus_guess_button">
				<button class="btn btn-primary" type="submit" id="f_g1_b">generate 1</button>
			</div>
		</div>

		<div id="f_s1">
			<div class="input-group mb-3 w-50">
				<input type="text" class="form-control" id="f_s1_ii" name="key" placeholder="Your Current Stop Key">
				<input type="text" class="form-control" id="f_s1_i" name="key" placeholder="Stop to Reroll" aria-label="bus_guess" aria-describedby="bus_guess_button">
				<button class="btn btn-primary" type="submit" id="f_s1_b">sentosa</button>
			</div>
		</div>

		<p id="p_stopkey"></p>
		<p id="p_info"></p>

		<button class="btn btn-primary" type="submit" id="ksk">copy stop key</button>

		<div id="map"></div>


	</div>

		<div class="modal-dialog">
			<div class="modal-content">
			</div>
		</div>
