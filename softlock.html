<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap Styling -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">

	<link href="style/style.css" rel="stylesheet">

	<!-- Leaflet -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
	
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

	<!-- Font -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source Code Pro">

	<!-- DataTables -->
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">

	<title>Lockout - Cursed Mode</title>
</head>

<body>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
		crossorigin="anonymous"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

	<nav class="navbar navbar-expand-lg navbar-dark">
		<div class="container-fluid">
			<a href="/" class="navbar-brand text-light mx-2">Lockout - Cursed Mode</a>
			<button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarCollapse">
				<div class="navbar-nav ms-auto">
					
				</div>
			</div>
		</div>
	</nav>

	<div class="container mt-5">

		<p id="timer">00:00</p>

		<p id="p_feedback">
			Current Run: <span id="p_feedback_run" class="f-b"></span> (<span id="p_feedback_cs" class="f-b">0</span>)
			<br>
			Best Score: <span id="p_feedback_ms" class="f-b">-</span>
		</p>
		<p id="p_loading">Loading Data...</p>

		<div id="f_start">
			<button class="btn btn-primary mb-3" type="submit" id="b_start">start</button>
		</div>

		<div id="f_guess">
			You're on <span id="p_current_bus">-</span>! <span id="p_info">Transfer to: </span>
			<div class="input-group mb-3 w-50">
				<input type="text" class="form-control" id="i_guess" name="key" placeholder="Guess..." aria-label="bus_guess" aria-describedby="bus_guess_button">
				<button class="btn btn-primary" type="submit" id="b_guess">&#x25B6;</button>
			</div>
		</div>

		<div id="detail"></div>

	</div>

	<div class="modal fade text-center" id="model_display">
		<div class="modal-dialog">
			<div class="modal-content">
			</div>
		</div>
	</div>

	<script type="text/javascript" src="js/softlock.js"></script>

</body>

</html>
