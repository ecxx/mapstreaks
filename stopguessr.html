<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap Styling -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">

	<link href="style/style.css" rel="stylesheet">

	<!-- Leaflet -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
	
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

	<!-- Font -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source Code Pro">

	<!-- DataTables -->
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">

	<title>StopGuessr</title>
</head>

<body>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
		crossorigin="anonymous"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
	<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

	<nav class="navbar navbar-expand-lg navbar-dark">
		<div class="container-fluid">
			<a href="/" class="navbar-brand text-light mx-2">StopGuessr</a>
			<button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarCollapse">
				<div class="navbar-nav ms-auto">
					
				</div>
			</div>
		</div>
	</nav>

	<div class="container mt-5">

		<p id="p_feedback">
			Session Best Distance: <span class="f-c" id="p_feedback_best">-</span> km<br>
			Session Mean Distance: <span class="f-g" id="p_feedback_mean">-</span> km<br>
			Last 5: <span class="f-b" id="p_feedback_l5">-</span><br>
		</p>
		<p id="p_loading">Loading Data...</p>

		<div id="f_start">
			<button class="btn btn-primary mb-3" type="submit" id="b_start">start</button>
		</div>

		<div id="f_guess">
			<button class="btn btn-primary mb-3" type="submit" id="b_guess">enter</button>
		</div>

		<p id="p_info"></p>

		<div id="map"></div>

	</div>

	<div class="modal fade text-center" id="model_display">
		<div class="modal-dialog">
			<div class="modal-content">
			</div>
		</div>
	</div>

	<script type="text/javascript" src="js/stopguessr.js"></script>

</body>

</html>
